<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>节拍汉堡塔</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f4ead8;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;top:0;display:block}
#hud{pointer-events:none}
#toolbar{position:fixed;z-index:12;top:104px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
button{font-family:Kuaile,"Microsoft YaHei",sans-serif;cursor:pointer;color:#2a2230;border:2px solid #2a2230;border-radius:12px;background:#fffaf0;font-size:14px;padding:8px 12px;touch-action:manipulation;box-shadow:2px 3px 0 #2a223025}
button:active{transform:translateY(2px);box-shadow:none}button:focus-visible{outline:3px solid #ed8150;outline-offset:3px}
#toolbar button{font-size:12px;padding:6px 10px;border-radius:9px}
#overlay{position:fixed;inset:0;z-index:10;background:#2a223079;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;touch-action:pan-y}
#overlay[hidden]{display:none}.sheet{box-sizing:border-box;width:min(370px,100%);max-height:calc(100dvh - 36px);overflow-y:auto;border:3px solid #2a2230;border-radius:24px;background:#fffaf0;box-shadow:7px 8px 0 #2a223055;padding:24px 20px 18px;text-align:center;font-family:Kuaile,"Microsoft YaHei",sans-serif;color:#2a2230;scrollbar-width:thin;touch-action:pan-y}
body:has(#overlay:not([hidden])) #toolbar{top:8px;left:auto;right:8px;transform:none}
h1{font-size:32px;line-height:1.1;margin:8px 0 12px}.eyebrow{font-family:Lilita,sans-serif;letter-spacing:3px;color:#bc6548;font-size:12px}.intro{font-size:14px;color:#8a5a6a;margin:10px 0 15px;line-height:1.5}
.burger-hero{display:flex;flex-direction:column;align-items:center;height:112px;margin:0 auto 8px;justify-content:center}.burger-hero canvas{position:static;width:180px;height:108px;flex:none}.burger-hero img{width:112px;height:auto;max-height:38px;object-fit:contain;margin:-3px 0}
.modes{display:grid;gap:8px}.mode{text-align:left;padding:10px 14px;background:#fff}.mode strong,.mode small{display:block}.mode strong{font-size:17px}.mode small{font-size:12px;margin-top:5px;color:#8a5a6a}.mode.selected{background:#fff0b5;border-color:#c56c28;box-shadow:3px 3px 0 #f0b544}
.primary{display:block;width:100%;background:#ffcc2a;font-size:19px;padding:12px;margin-top:10px;font-weight:bold}.link{background:transparent;border:0;box-shadow:none;margin-top:8px;color:#a05e44}.record{font-size:12px;color:#a05e44;margin:12px 0}.hint{font-size:12px;line-height:1.6;color:#8a5a6a;margin:12px 0 0}.choice-caption{font-size:18px}.upgrade{display:grid;grid-template-columns:38px 1fr;text-align:left;width:100%;margin:12px 0;padding:15px 12px;background:#fff;align-items:center}.upgrade strong{font-size:19px}.upgrade small{grid-column:2;font-size:12px;line-height:1.5;margin-top:6px;color:#8a5a6a}.perk-icon{grid-row:span 2;font-size:28px;color:#e99523}.upgrade:hover{background:#fff0b5}.album{display:grid;grid-template-columns:1fr 1fr;gap:10px}.food{display:flex;align-items:center;flex-direction:column;justify-content:center;background:#fff;border:2px solid #e5d5c2;border-radius:12px;min-height:100px;padding:8px 3px}.food img{max-width:100px;max-height:45px;object-fit:contain;margin-bottom:6px}.food strong{font-size:15px}.food small{font-size:11px;color:#8a5a6a;margin-top:5px}.food.locked img{filter:grayscale(1);opacity:.2}
@media(max-height:680px){.sheet{padding:18px 16px 12px}h1{font-size:27px}.burger-hero{height:80px}.burger-hero canvas{position:static;width:180px;height:108px;flex:none}.burger-hero img{width:95px;max-height:30px}.mode{padding:8px 12px}.intro{margin:8px 0}.hint{font-size:11px}.primary{padding:10px}}
